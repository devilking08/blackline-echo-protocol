<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1020" viewBox="0 0 1280 1020" role="img" aria-labelledby="title desc"><title id="title">BLACKLINE system architecture</title><desc id="desc">Controls feed the game application, which updates pure simulation, city rendering, interface and sound, and local browser saves. The code is tested, built into static files, and hosted on Vercel or GitHub Pages. No game server is required.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6f9da8"/></marker></defs><rect width="1280" height="1020" fill="#0b151e"/><text x="40" y="57" fill="#e7f1eb" font-family="Arial,sans-serif" font-size="32" font-weight="700">BLACKLINE / HOW THE GAME WORKS</text><text x="40" y="89" fill="#aac5cc" font-family="Arial,sans-serif" font-size="16">A whole playable heist in your browser. No game server, account, database or secret keys.</text><g fill="none" stroke="#6f9da8" stroke-width="2" marker-end="url(#arrow)"><path d="M380 197H445"/><path d="M820 197H885"/><path d="M560 250V293H210V340"/><path d="M635 250V340"/><path d="M710 250V293H1060V340"/><path d="M380 410H445"/><path d="M820 410H885"/><path d="M210 475V565"/><path d="M380 622H445"/><path d="M820 622H885"/></g><rect x="40" y="145" width="340" height="105" rx="4" fill="#142731" stroke="#34515c"/><rect x="40" y="145" width="340" height="3" fill="#d2ff54"/><text x="60" y="176" fill="#d2ff54" font-family="Arial,sans-serif" font-weight="700" font-size="14">YOU / THE RUNNER</text><text x="60" y="203" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Keyboard + mouse or touch</text><text x="60" y="225" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Move · look · fire · interact</text><rect x="450" y="145" width="370" height="105" rx="4" fill="#142731" stroke="#34515c"/><rect x="450" y="145" width="370" height="3" fill="#d2ff54"/><text x="470" y="176" fill="#d2ff54" font-family="Arial,sans-serif" font-weight="700" font-size="14">APPLICATION / main.ts</text><text x="470" y="203" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Modes · input · mission orchestration</text><text x="470" y="225" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Frame loop · persistence · camera</text><rect x="890" y="145" width="340" height="105" rx="4" fill="#142731" stroke="#34515c"/><rect x="890" y="145" width="340" height="3" fill="#71dae4"/><text x="910" y="176" fill="#71dae4" font-family="Arial,sans-serif" font-weight="700" font-size="14">BROWSER STORAGE</text><text x="910" y="203" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Validated checkpoint + preferences</text><text x="910" y="225" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Local only · no cloud account</text><rect x="40" y="345" width="340" height="130" rx="4" fill="#142731" stroke="#34515c"/><rect x="40" y="345" width="340" height="3" fill="#d2ff54"/><text x="60" y="376" fill="#d2ff54" font-family="Arial,sans-serif" font-weight="700" font-size="14">PURE SIMULATION / core.ts</text><text x="60" y="403" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Mission state + two endings</text><text x="60" y="425" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Ammo · healing · neural charge</text><text x="60" y="447" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Collision · visibility · seeded puzzle</text><rect x="450" y="345" width="370" height="130" rx="4" fill="#142731" stroke="#34515c"/><rect x="450" y="345" width="370" height="3" fill="#71dae4"/><text x="470" y="376" fill="#71dae4" font-family="Arial,sans-serif" font-weight="700" font-size="14">CITY &amp; RENDERER / world.ts</text><text x="470" y="403" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Procedural geometry + signs</text><text x="470" y="425" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Actors · vehicles · rain · pickups</text><text x="470" y="447" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Three.js → optional bloom → canvas</text><rect x="890" y="345" width="340" height="130" rx="4" fill="#142731" stroke="#34515c"/><rect x="890" y="345" width="340" height="3" fill="#ff8c98"/><text x="910" y="376" fill="#ff8c98" font-family="Arial,sans-serif" font-weight="700" font-size="14">INTERFACE &amp; SOUND</text><text x="910" y="403" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">ui.ts + style.css → menus / HUD</text><text x="910" y="425" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Maps · dialogue · subtitles</text><text x="910" y="447" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">audio.ts → local Web Audio</text><rect x="40" y="570" width="340" height="105" rx="4" fill="#142731" stroke="#34515c"/><rect x="40" y="570" width="340" height="3" fill="#71dae4"/><text x="60" y="601" fill="#71dae4" font-family="Arial,sans-serif" font-weight="700" font-size="14">SOURCE &amp; VERIFICATION</text><text x="60" y="628" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">TypeScript + locked dependencies</text><text x="60" y="650" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">17 unit + 13 browser checks</text><rect x="450" y="570" width="370" height="105" rx="4" fill="#142731" stroke="#34515c"/><rect x="450" y="570" width="370" height="3" fill="#d2ff54"/><text x="470" y="601" fill="#d2ff54" font-family="Arial,sans-serif" font-weight="700" font-size="14">BUILD / VITE</text><text x="470" y="628" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Type check → bundle → dist/</text><text x="470" y="650" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">HTML + JS + CSS + local fonts</text><rect x="890" y="570" width="340" height="105" rx="4" fill="#142731" stroke="#34515c"/><rect x="890" y="570" width="340" height="3" fill="#71dae4"/><text x="910" y="601" fill="#71dae4" font-family="Arial,sans-serif" font-weight="700" font-size="14">STATIC HOSTING</text><text x="910" y="628" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">Vercel OR GitHub Pages</text><text x="910" y="650" fill="#d0e0e3" font-family="Arial,sans-serif" font-size="15">HTTPS files → your browser</text><text x="40" y="746" fill="#e7f1eb" font-family="Arial,sans-serif" font-size="23" font-weight="700">THE CONTRACT / WHAT THE PLAYER DOES</text><rect x="40" y="786" width="212" height="90" fill="#1b302c" stroke="#6c843d"/><text x="56" y="820" fill="#d2ff54" font-family="Arial,sans-serif" font-size="15" font-weight="700">MEET IONA</text><text x="56" y="849" fill="#ccdedb" font-family="Arial,sans-serif" font-size="13">Learn the stakes</text><path d="M254 830h27" stroke="#6f9da8" stroke-width="2" marker-end="url(#arrow)"/><rect x="287" y="786" width="212" height="90" fill="#1b302c" stroke="#6c843d"/><text x="303" y="820" fill="#d2ff54" font-family="Arial,sans-serif" font-size="15" font-weight="700">BREACH RELAY</text><text x="303" y="849" fill="#ccdedb" font-family="Arial,sans-serif" font-size="13">Solve four nodes</text><path d="M501 830h27" stroke="#6f9da8" stroke-width="2" marker-end="url(#arrow)"/><rect x="534" y="786" width="212" height="90" fill="#1b302c" stroke="#6c843d"/><text x="550" y="820" fill="#d2ff54" font-family="Arial,sans-serif" font-size="15" font-weight="700">TAKE THE ECHO</text><text x="550" y="849" fill="#ccdedb" font-family="Arial,sans-serif" font-size="13">Broadcast or sell</text><path d="M748 830h27" stroke="#6f9da8" stroke-width="2" marker-end="url(#arrow)"/><rect x="781" y="786" width="212" height="90" fill="#1b302c" stroke="#6c843d"/><text x="797" y="820" fill="#d2ff54" font-family="Arial,sans-serif" font-size="15" font-weight="700">EXTRACT</text><text x="797" y="849" fill="#ccdedb" font-family="Arial,sans-serif" font-size="13">Get back to the car</text><path d="M995 830h27" stroke="#6f9da8" stroke-width="2" marker-end="url(#arrow)"/><rect x="1028" y="786" width="212" height="90" fill="#1b302c" stroke="#6c843d"/><text x="1044" y="820" fill="#d2ff54" font-family="Arial,sans-serif" font-size="15" font-weight="700">ENDING</text><text x="1044" y="849" fill="#ccdedb" font-family="Arial,sans-serif" font-size="13">Choice + reward</text><text x="40" y="934" fill="#aac5cc" font-family="Arial,sans-serif" font-size="15">For developers: core.ts is renderer-independent; tests can verify game rules without WebGL.</text><text x="40" y="964" fill="#aac5cc" font-family="Arial,sans-serif" font-size="15">For everyone: your computer plays the game; the website only sends the files; saves stay in your browser.</text></svg>